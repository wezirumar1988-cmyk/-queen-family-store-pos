<div id="signInBox">

<label>Language / Afaan</label>
<select id="loginLanguage" onchange="changeLanguage(this.value)">
<option value="en">English</option>
<option value="om">Afaan Oromoo</option>
</select>

<label>Email</label>
<input
id="loginEmail"
type="email"
placeholder="example@email.com"
>

<label>Password</label>
<input
id="loginPassword"
type="password"
placeholder="Password"
>

<p id="loginError" class="error"></p>

<button
onclick="signIn()"
style="width:100%"
>
SIGN IN
</button>

<p class="center">
New user?
<button
class="auth-switch"
onclick="showSignUp()"
>
Create Account
</button>
</p>

<p class="center">
<button
class="auth-switch"
onclick="forgotPassword()"
>
Forgot Password?
</button>
</p>

</div>
